<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContabilCMRT - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; margin: 0; background: #0E204E; color: #FFFFFF; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        form { background: #FFFFFF; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #091A34; font-size: 24px; margin-bottom: 30px; }
        label { display: block; text-align: left; color: #091A34; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #DEE2E6; border-radius: 8px; margin-bottom: 20px; font-family: inherit; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #0E204E, #1A3A8A); color: #FFFFFF; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: inherit; }
        button:hover { opacity: 0.9; }
        a { color: #0E204E; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Bem-Vindo(a) a ContábilCMRT</h1>
    <form action="">
        <label for="login">Login</label>
        <input type="text" id="login" name="login"><br>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha"><br>

    <a href="#">Esqueci a senha</a><br><br>

    <button type="submit">Entrar</button>
</form>
    
</body>
</html>
