<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro Razão - CMRT</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { box-sizing: border-box; margin: 0; background: var(--bg); color: var(--text); }
        .sidebar-item { cursor: pointer; text-decoration: none; color: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; transition: 0.2s; font-size: 14px; }
        a.sidebar-item:hover { background: rgba(255,255,255,0.1); }
        .sidebar-item.active { background: #ffffff; color: #1e293b; font-weight: 600; border-left: 3px solid #4f8ef7; padding-left: 11px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 14px; }
        .submenu { margin-left: 12px; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 8px; }
        .sidebar-group-label { font-size: 11px; text-transform: uppercase; color: #B0B8C1; margin: 20px 10px 8px; letter-spacing: 0.05em; }
    </style>
</head>

<body class="h-full">
  <div style="display:flex; height:100vh; width:100%; overflow:hidden;">
    
    <aside style="width:230px; min-width:230px; background:#0E204E; display:flex; flex-direction:column; overflow-y:auto;">
      <div style="padding:20px 18px 12px; border-bottom:1px solid rgba(255,255,255,0.1);">
        <img src="../img/CMRTlogoWhite.png" alt="Logo CMRT" style="max-width: 100%;">
      </div>
      
      <nav style="flex:1; padding:10px 8px;">
        <a href="../prototipo.html" class="sidebar-item">
          <i data-lucide="layout-dashboard" style="width:16px;height:16px;"></i> Dashboard
        </a>

        <div class="sidebar-group-label">Cadastro</div>
        <div class="submenu">
          <a href="clientes.html" class="sidebar-item"><i data-lucide="user" style="width:14px;height:14px;"></i> Clientes</a>
          <a href="fornecedores.html" class="sidebar-item"><i data-lucide="truck" style="width:14px;height:14px;"></i> Fornecedores</a>
          <a href="enderecos.html" class="sidebar-item"><i data-lucide="map-pin" style="width:14px;height:14px;"></i> Endereços</a>
          <a href="plano-contas.html" class="sidebar-item"><i data-lucide="list" style="width:14px;height:14px;"></i> Plano de Contas</a>
        </div>

        <div class="sidebar-group-label">Financeiro</div>
        <div class="submenu">
          <a href="contas-pagar.html" class="sidebar-item"><i data-lucide="arrow-up-circle" style="width:14px;height:14px;"></i> Contas a Pagar</a>
        </div>

        <div class="sidebar-group-label">Contabilidade</div>
        <div class="submenu">
          <a href="lancamentos.html" class="sidebar-item"><i data-lucide="pen-line" style="width:14px;height:14px;"></i> Lançamentos</a>
          <a href="livro-diario.html" class="sidebar-item"><i data-lucide="book" style="width:14px;height:14px;"></i> Livro Diário</a>
          <a href="livro-razao.html" class="sidebar-item active"><i data-lucide="book-marked" style="width:14px;height:14px;"></i> Livro Razão</a>
          <a href="dre.html" class="sidebar-item"><i data-lucide="file-bar-chart" style="width:14px;height:14px;"></i> Apuração de Resultado do Exercício</a>
        </div>
      </nav>
    </aside>

    <main style="flex:1; display:flex; flex-direction:column; min-width:0; overflow-y:auto; border-left: none;">
      <header class="header-custom">
        <div>
          <div style="font-size:18px; font-weight:700;">Livro Razão</div>
          <div style="font-size:12px; color:var(--text-muted);">Registro detalhado dos movimentos por conta</div>
        </div>
      
      <div class="header-direita">
        <a href="prototipo.html" class="header-back-link">
          <i data-lucide="arrow-left"></i>
          Voltar
        </a>
      </div>
      </header>
      
      <div id="page-content" style="flex:1; padding:24px 28px; overflow-y:auto;">
        <div class="stat-card">
            <table class="tabela-contabil" id="tabelaLivroRazao">
                <tbody id="corpoTabela">
                    <tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-muted);">Carregando livro razão...</td></tr>
                </tbody>
            </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../api.js"></script>
  <script>
    lucide.createIcons();

    async function carregarLivroRazao() {
        const corpo = document.getElementById('corpoTabela');
        try {
            const url = 'http://localhost:3000/api/livro-razao';
            console.log('Buscando livro razão em', url);
            const response = await fetch(url, { cache: 'no-store' });

                if (!response.ok) {
                    const texto = await response.text();
                    throw new Error(`HTTP ${response.status} - ${texto}`);
                }

                const dados = await response.json();
                renderizarTabela(dados);
            } catch (err) {
                console.error('Erro ao carregar livro razão:', err);
                corpo.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--danger); padding:20px;">Erro ao carregar dados do servidor: ${err.message}</td></tr>`;
            }
        }

        function renderizarTabela(dados) {
            const corpo = document.getElementById('corpoTabela');
            corpo.innerHTML = '';

            if (dados.length === 0) {
                corpo.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-muted);">Nenhum movimento encontrado.</td></tr>`;
                return;
            }

            // Group by codigo_conta
            const grouped = dados.reduce((acc, item) => {
                if (!acc[item.codigo_conta]) {
                    acc[item.codigo_conta] = { nome_conta: item.nome_conta, movimentos: [] };
                }
                acc[item.codigo_conta].movimentos.push(item);
                return acc;
            }, {});

            Object.keys(grouped).forEach(codigo => {
                const { nome_conta, movimentos } = grouped[codigo];

                // Account header row
                const headerTr = document.createElement('tr');
                headerTr.className = 'table-row-contabil account-header';
                headerTr.innerHTML = `
                    <td colspan="5" style="font-weight: bold; background-color: var(--background-secondary); padding: 10px;">
                        ${codigo} ${nome_conta}
                    </td>
                `;
                corpo.appendChild(headerTr);

                // Column labels row
                const labelTr = document.createElement('tr');
                labelTr.className = 'table-row-contabil label-row';
                labelTr.innerHTML = `
                    <td>Data</td>
                    <td class="numeric">Débito</td>
                    <td class="numeric">Crédito</td>
                    <td>Histórico</td>
                    <td class="numeric">Saldo</td>
                `;
                corpo.appendChild(labelTr);

                // Movement rows
                movimentos.forEach(item => {
                    const dataFormatada = new Date(item.data_movimento).toLocaleDateString('pt-BR', {timeZone: 'UTC'});
                    const debitoFormatado = item.debito ? new Number(item.debito).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
                    const creditoFormatado = item.credito ? new Number(item.credito).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
                    const historicoTruncado = item.historico ? item.historico.substring(0, 50) : '';
                    const saldoFormatado = new Number(item.saldo).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    const tr = document.createElement('tr');
                    tr.className = 'table-row-contabil movimento-row';

                    tr.innerHTML = `
                        <td>${dataFormatada}</td>
                        <td class="valor-celula numeric">${debitoFormatado}</td>
                        <td class="valor-celula numeric">${creditoFormatado}</td>
                        <td>${historicoTruncado}</td>
                        <td class="valor-celula numeric ${item.saldo < 0 ? 'status-vencido' : ''}">${saldoFormatado}</td>
                    `;

                    corpo.appendChild(tr);
                });

                // Add a small separator after each account
                const separatorTr = document.createElement('tr');
                separatorTr.innerHTML = `<td colspan="5" style="height: 5px;"></td>`;
                corpo.appendChild(separatorTr);
            });
        }

        // Carregar dados quando o DOM estiver pronto
        document.addEventListener('DOMContentLoaded', carregarLivroRazao);
    </script>

</body>
</html>
